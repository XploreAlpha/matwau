# MatWAU Goldens 测试集 — mat-exp(50 case)
# 写于:2026-07-24(W6 Day 1)
# 用途:mat-exp 升级 mock / 真 XRD 仪器后跑这套 case,验证 pass-rate > 50% (Stage 1) / > 80% (Stage 2)
# per MatWAU-Harness-Loop-工程心法实践.md §5.5
# 注:mat-exp Goldens 是从 mat-hpc Goldens 衍生(mat-hpc 输出 → mat-exp 输入)
#     跑分时直接转 mat-gen 的 candidates 为 HPCJobResult(简化 4 段链路)

# ============================================================================
# 锂电池正极材料实验方案(Li-ion cathode exp,15 case)
# ============================================================================

- id: E001
  category: Li-ion cathode exp
  intent: "出 LiCoO2 实验方案(XRD + 烧结)"
  expected:
    formula_must_contain: "Li"
    num_candidates: ">= 3"

- id: E002
  category: Li-ion cathode exp
  intent: "LiFePO4 (LFP) 实验方案"
  expected:
    formula_must_contain_all: ["Li", "Fe", "P", "O"]
    num_candidates: ">= 3"

- id: E003
  category: Li-ion cathode exp
  intent: "NMC811 LiNi0.8Mn0.1Co0.1O2 实验方案"
  expected:
    formula_must_contain_any: ["Ni", "Mn", "Co"]
    num_candidates: ">= 3"

- id: E004
  category: Li-ion cathode exp
  intent: "Li2MnO3 Li-rich 实验方案"
  expected:
    formula_must_contain: "Li"
    formula_must_contain_any: ["Mn", "O"]
    num_candidates: ">= 3"

- id: E005
  category: Li-ion cathode exp
  intent: "无钴 Li-ion 正极实验方案"
  expected:
    formula_must_contain: "Li"
    formula_must_not_contain_any: ["Co"]
    num_candidates: ">= 5"

- id: E006
  category: Li-ion cathode exp
  intent: "高镍 NMC 实验方案"
  expected:
    formula_must_contain_any: ["Ni"]
