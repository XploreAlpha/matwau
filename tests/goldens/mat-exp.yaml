- id: E007
  category: Li-ion cathode exp
  intent: "LiNiO2 实验方案"
  expected:
    formula_must_contain: "Li"
    formula_must_contain_any: ["Ni", "O"]
    num_candidates: ">= 3"

- id: E008
  category: Li-ion cathode exp
  intent: "LiMn2O4 尖晶石实验方案"
  expected:
    formula_must_contain_all: ["Li", "Mn", "O"]
    num_candidates: ">= 3"

- id: E009
  category: Li-ion cathode exp
  intent: "LiFePO4 高倍率实验方案"
  expected:
    formula_must_contain_all: ["Li", "Fe", "P", "O"]
    num_candidates: ">= 3"

- id: E010
  category: Li-ion cathode exp
  intent: "LiCoO2 高压相实验方案"
  expected:
    formula_must_contain: "Li"
    num_candidates: ">= 3"

- id: E011
  category: Li-ion cathode exp
  intent: "LiNi1/3Mn1/3Co1/3O2 三元实验方案"
