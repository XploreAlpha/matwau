    formula_must_contain_any: ["Ni", "Mn", "Co"]
    num_candidates: ">= 3"

- id: E012
  category: Li-ion cathode exp
  intent: "无钴 LiNi0.5Mn0.5O2 实验方案"
  expected:
    formula_must_contain_any: ["Ni", "Mn"]
    formula_must_not_contain_any: ["Co"]
    num_candidates: ">= 3"

- id: E013
  category: Li-ion cathode exp
  intent: "Li4Ti5O12 负极实验方案"
  expected:
    formula_must_contain_all: ["Li", "Ti", "O"]
    num_candidates: ">= 3"

- id: E014
  category: Li-ion cathode exp
  intent: "LiFeSO4F 新型正极实验方案"
  expected:
    formula_must_contain_any: ["Li", "Fe"]
    num_candidates: ">= 2"

- id: E015
  category: Li-ion cathode exp
  intent: "Li2FeSiO4 聚阴离子实验方案"
