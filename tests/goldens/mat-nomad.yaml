# MatWAU Goldens 测试集 — mat-nomad(20 case)
# 写于:2026-08-04(v1.3-Academic M2)
# 用途:验证 NOMAD archive 综合数据查询 agent 的化学式提取 + record 结构 + canonical key + metainfo 映射
# per MatWAU-v1.3-Academic-dev-plan-20260804.md §五 M2 第 14 项
# 跑分目标:pass-rate ≥ 75%

# 字段约定(per tests/goldens/mat-oqmd.yaml 风格):
#   id: N001-N020
#   category: query / extraction / metainfo / canonical / e2e
#   intent: 用户 1 句话意图
#   expected:
#     formula_extracted: 应提取的化学式字符串
#     min_n_results: 至少多少条记录
#     source_platform: 应为 "NOMAD"
#     source_doi: 应含的 DOI 前缀
#     canonical_reduced_formula: 归一化后化学式
#     canonical_pearson: Pearson 符号(可能空)
#     canonical_spacegroup_number: 空间群编号

