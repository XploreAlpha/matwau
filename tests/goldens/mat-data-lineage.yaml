# MatWAU Goldens 测试集 — mat-data-lineage(12 case)
# 写于:2026-07-24(W14 Day 3)
# 用途:验证 lineage 记录 + ancestors/descendants/tree 查询
# per MatWAU-开发计划 §七 W14
# 跑分目标:pass-rate > 50% (Stage 1) / > 80% (Stage 2)

# 字段约定:
#   id: D001-D012
#   category: record / hash / query / e2e
#   intent: 用户 1 句话
#   expected:
#     has_lineage_id: 记录应有 lineage_id
#     has_run_id: 记录应有 run_id
#     store_size: 期望 store size
#     query_type: 期望 query 类型
#     target_run_id: 查询目标
#     has_ancestors / has_descendants: 期望血缘存在
#     min_count: 期望至少多少条
#     hash_format: 期望 hash 长度

# ============================================================================
# 记录模式(4 case)
# ============================================================================

- id: D001
  category: record
  intent: "记录 1 个 mat-gen run"
  artifacts:
    query_type: "record"
    run_id: "run-001"
    agent_name: "mat-gen-agent"
    input_artifacts:
      message: "design new"
    output_artifacts:
      candidates:
        - {formula: "LiCoO2"}
        - {formula: "LiFePO4"}
  expected:
    has_lineage_id: true
    has_run_id: "run-001"
    store_size: 1

- id: D002
  category: record
  intent: "记录 1 个 mat-sim run(带 parent)"
  artifacts:
    query_type: "record"
    run_id: "run-002"
    agent_name: "mat-sim-agent"
    input_artifacts:
      candidates:
        - {formula: "LiCoO2"}
    output_artifacts:
      simulated:
        - {formula: "LiCoO2", relaxed_energy: -3.5}
    parent_run_id: "run-001"
  expected:
    has_lineage_id: true
    has_run_id: "run-002"
    store_size: 2

- id: D003
  category: record
  intent: "记录 1 个 mat-critic run"
  artifacts:
    query_type: "record"
    run_id: "run-003"
    agent_name: "mat-critic-agent"
    input_artifacts:
      candidates:
        - {formula: "LiCoO2"}
    output_artifacts:
      verdict: "pass"
    parent_run_id: "run-002"
  expected:
    has_lineage_id: true
    store_size: 3

- id: D004
  category: record
  intent: "记录 1 个 mat-hpc run"
  artifacts:
    query_type: "record"
    run_id: "run-004"
    agent_name: "mat-hpc-agent"
    input_artifacts:
      jobs:
        - {job_id: "vasp-001"}
    output_artifacts:
      results:
        - {energy: -5.2}
    parent_run_id: "run-003"
    cost: 100.0
  expected:
    has_lineage_id: true
    store_size: 4

# ============================================================================
# Hash 计算(2 case)
# ============================================================================

- id: D005
  category: hash
  intent: "同样输入产生同样 hash"
  expected:
    hash_format: 16  # 16 字符 SHA256 prefix
    hash_stable: true

- id: D006
  category: hash
  intent: "不同输入产生不同 hash"
  expected:
    hash_stable: true
    hash_different: true

# ============================================================================
# 查询模式(3 case)
# ============================================================================

- id: D007
  category: query
  intent: "查 run-003 的 ancestors"
  artifacts:
    query_type: "ancestors"
    target_run_id: "run-003"
  expected:
    query_type: "ancestors"
    target_run_id: "run-003"
    has_ancestors: true
    min_count: 2

- id: D008
  category: query
  intent: "查 run-001 的 descendants"
  artifacts:
    query_type: "descendants"
    target_run_id: "run-001"
  expected:
    query_type: "descendants"
    target_run_id: "run-001"
    has_descendants: true
    min_count: 3

- id: D009
  category: query
  intent: "查 run-002 的 tree"
  artifacts:
    query_type: "tree"
    target_run_id: "run-002"
  expected:
    query_type: "tree"
    target_run_id: "run-002"
    min_count: 1

# ============================================================================
# 端到端(3 case)
# ============================================================================

- id: D010
  category: e2e
  intent: "完整 4 段 lineage + tree 查询"
  artifacts:
    query_type: "tree"
    target_run_id: "run-002"
  expected:
    query_type: "tree"
    min_count: 1
    has_ancestors: true
    has_descendants: true

- id: D011
  category: e2e
  intent: "JSON 导出"
  expected:
    json_exportable: true

- id: D012
  category: e2e
  intent: "完整 5 段 + 2 支 lineage"
  artifacts:
    query_type: "ancestors"
    target_run_id: "run-005"
  expected:
    min_count: 4
    has_ancestors: true

# ============================================================================
# W32 新增:auto_record(orchestrator 自动打 lineage 端到端,15 case D013-D027)
# ============================================================================
# 字段约定(W32):
#   category: auto_record
#   expected:
#     n_workflow_records_min: 期望至少多少 workflow 记录
#     n_experiment_records_min: 期望至少多少 experiment 记录
#     n_chemist_records_min: 期望至少多少 chemist 记录
#     n_critic_records_min: 期望至少多少 critic 记录
#     has_batch_record: 是否应有 batch_workflow 记录
#     kinds_present: 期望出现的 kind 列表
#     all_have_run_id: 记录都应有 run_id
#     all_have_agent_name: 记录都应有 agent_name
#     metadata_has_kind: 期望 metadata.kind 字段存在

- id: D013
  category: auto_record
  intent: "MatOrchestrator.run() 打 1 条 workflow record"
  expected:
    n_workflow_records_min: 1
    kinds_present: ["workflow"]
    all_have_run_id: true
    all_have_agent_name: true

- id: D014
  category: auto_record
  intent: "MatOrchestrator.run() 3 个 workflow → 3 条 workflow record"
  expected:
    n_workflow_records_min: 3
    kinds_present: ["workflow"]
    all_have_agent_name: true

- id: D015
  category: auto_record
  intent: "MatOrchestrator.run_batch() 3 实验 → 3 experiment + 1 batch record"
  expected:
    n_experiment_records_min: 3
    has_batch_record: true
    kinds_present: ["experiment", "batch_workflow"]

- id: D016
  category: auto_record
  intent: "MatOrchestrator.run_batch() 单实验 → 1 experiment + 1 chemist + 1 critic + 1 batch"
  expected:
    n_experiment_records_min: 1
    n_chemist_records_min: 1
    n_critic_records_min: 1
    has_batch_record: true
    kinds_present: ["experiment", "chemist", "critic", "batch_workflow"]

- id: D017
  category: auto_record
  intent: "critic record.parent_run_id 应指向 chemist run_id"
  expected:
    critic_parent_ends_with: "-chemist"

- id: D018
  category: auto_record
  intent: "experiment record.metadata 应含 verdict + target_sample"
  expected:
    experiment_metadata_keys: ["verdict", "target_sample"]

- id: D019
  category: auto_record
  intent: "batch_workflow record.metadata 应含 n_total + overall_verdict + max_workers"
  expected:
    batch_metadata_keys: ["n_total", "overall_verdict", "max_workers", "kind"]

- id: D020
  category: auto_record
  intent: "enable_lineage=False → 不打任何 record"
  artifacts:
    enable_lineage: false
  expected:
    n_records_max: 0

- id: D021
  category: auto_record
  intent: "LineageRecorder.record() 通用 API 落 1 条"
  expected:
    n_records_min: 1
    kinds_present: []

- id: D022
  category: auto_record
  intent: "LineageRecorder.record_critic_verdict() 落 1 条 critic 记录"
  expected:
    kinds_present: ["critic"]

- id: D023
  category: auto_record
  intent: "LineageRecorder.record_chemist_report() 落 1 条 chemist 记录"
  expected:
    kinds_present: ["chemist"]

- id: D024
  category: auto_record
  intent: "SQLite backend 持久化 → 重开 store 数据还在"
  expected:
    n_records_min: 2
    persistence: true

- id: D025
  category: auto_record
  intent: "PostgresBackend schema 用 JSONB(字段 metadata 不是 TEXT)"
  expected:
    schema_metadata_is_jsonb: true

- id: D026
  category: auto_record
  intent: "PostgresBackend __enter__/__exit__ context manager 支持"
  expected:
    context_manager_supported: true

- id: D027
  category: auto_record
  intent: "MATWAU_LINEAGE_DISABLED=1 → get_lineage_store() 返回 None"
  expected:
    store_is_none_when_disabled: true