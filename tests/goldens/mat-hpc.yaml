# MatWAU Goldens 测试集 — mat-hpc(50 case)
# 写于:2026-07-24(W5 Day 1)
# 用途:mat-hpc 升级 mock / 真 Slurm 后跑这套 case,验证 pass-rate > 50% (Stage 1) / > 80% (Stage 2)
# per MatWAU-Harness-Loop-工程心法实践.md §5.5
# 注:mat-hpc Goldens 是从 mat-sim Goldens 衍生(mat-sim 输出 → mat-hpc 输入)

# ============================================================================
# 锂电池正极材料 HPC(Li-ion cathode HPC,15 case)
# ============================================================================

- id: H001
  category: Li-ion cathode HPC
  intent: "提交 LiCoO2 VASP relax 计算"
  expected:
    formula_must_contain: "Li"
    num_candidates: ">= 3"

- id: H002
  category: Li-ion cathode HPC
  intent: "对 LiFePO4 (LFP) 做 VASP 静态自洽"
  expected:
    formula_must_contain_all: ["Li", "Fe", "P", "O"]
    num_candidates: ">= 3"

- id: H003
  category: Li-ion cathode HPC
  intent: "提交 NMC811 LiNi0.8Mn0.1Co0.1O2 relax"
  expected:
    formula_must_contain_any: ["Ni", "Mn", "Co"]
    num_candidates: ">= 3"

- id: H004
  category: Li-ion cathode HPC
  intent: "Li2MnO3 Li-rich VASP relax"
  expected:
    formula_must_contain: "Li"
    formula_must_contain_any: ["Mn", "O"]
    num_candidates: ">= 3"

- id: H005
  category: Li-ion cathode HPC
  intent: "无钴 Li-ion 正极候选 VASP 提交"
  expected:
    formula_must_contain: "Li"
    formula_must_not_contain_any: ["Co"]
    num_candidates: ">= 5"

- id: H006
  category: Li-ion cathode HPC
  intent: "高镍 NMC 候选 VASP"
  expected:
    formula_must_contain_any: ["Ni"]
    num_candidates: ">= 3"

- id: H007
  category: Li-ion cathode HPC
  intent: "LiNiO2 VASP relax"
  expected:
    formula_must_contain: "Li"
    formula_must_contain_any: ["Ni", "O"]
    num_candidates: ">= 3"

- id: H008
  category: Li-ion cathode HPC
  intent: "LiMn2O4 尖晶石 VASP"
  expected:
    formula_must_contain_all: ["Li", "Mn", "O"]
    num_candidates: ">= 3"

- id: H009
  category: Li-ion cathode HPC
  intent: "LiFePO4 高倍率 VASP static"
  expected:
    formula_must_contain_all: ["Li", "Fe", "P", "O"]
    num_candidates: ">= 3"

- id: H010
  category: Li-ion cathode HPC
  intent: "LiCoO2 高压相 VASP"
  expected:
    formula_must_contain: "Li"
    num_candidates: ">= 3"

- id: H011
  category: Li-ion cathode HPC
  intent: "LiNi1/3Mn1/3Co1/3O2 三元 VASP"
  expected:
    formula_must_contain_any: ["Ni", "Mn", "Co"]
    num_candidates: ">= 3"

- id: H012
  category: Li-ion cathode HPC
  intent: "无钴 LiNi0.5Mn0.5O2 VASP"
  expected:
    formula_must_contain_any: ["Ni", "Mn"]
    formula_must_not_contain_any: ["Co"]
    num_candidates: ">= 3"

- id: H013
  category: Li-ion cathode HPC
  intent: "Li4Ti5O12 负极 VASP"
  expected:
    formula_must_contain_all: ["Li", "Ti", "O"]
    num_candidates: ">= 3"

- id: H014
  category: Li-ion cathode HPC
  intent: "LiFeSO4F 新型正极 VASP"
  expected:
    formula_must_contain_any: ["Li", "Fe"]
    num_candidates: ">= 2"

- id: H015
  category: Li-ion cathode HPC
  intent: "Li2FeSiO4 聚阴离子 VASP"
  expected:
