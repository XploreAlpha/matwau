# MatWAU Goldens 测试集 — mat-bayesian(25 case)
# 写于:2026-07-24(W13 Day 1)
# 用途:验证 GP + TPE 2 算法 + acquisition + suggest_next_batch
# per MatWAU-开发计划 §七 W13
# 跑分目标:pass-rate > 80% (Stage 2)

# 字段约定:
#   id: B001-B025
#   category: gp / tpe / integration / e2e
#   intent: 用户 1 句话意图
#   expected:
#     algorithm: 期望 algorithm_used (gp / tpe / ensemble)
#     status: searching / converging / converged
#     min_n_suggest / exact_n_suggest: next_batch 长度
#     has_best_so_far: 是否应有 best_so_far
#     min_convergence: convergence >= N
#     exclude_in_next_batch: 不应在 next_batch 的化学式
#     include_in_next_batch: 应在 next_batch 的化学式
#     forbidden_ok: 是否验证 forbidden 已应用
#     no_observed_in_next_batch: 已观测点不应再推荐

# artifacts:
#   observed: List[{formula, score}]
#   pool: List[{formula}]

