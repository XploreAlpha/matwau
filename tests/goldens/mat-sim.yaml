# MatWAU Goldens 测试集 — mat-sim(50 case)
# 写于:2026-07-24(W4 Day 1)
# 用途:mat-sim 升级 mock / 真 CHGNet 后跑这套 case,验证 pass-rate > 50% (Stage 1) / > 80% (Stage 2)
# per MatWAU-Harness-Loop-工程心法实践.md §5.5
# 注:mat-sim Goldens 是从 mat-gen Goldens 衍生(mat-gen 输出 → mat-sim 输入)

# ============================================================================
# 锂电池正极材料弛豫(Li-ion cathode relaxation,15 case)
# ============================================================================

- id: S001
  category: Li-ion cathode relaxation
  intent: "弛豫 LiCoO2 候选结构"
  expected:
    formula_must_contain: "Li"
    num_candidates: ">= 5"
    top_5_energy_below: -2.5
  must_pass_sim: true

- id: S002
  category: Li-ion cathode relaxation
  intent: "对 LiFePO4 (LFP) 候选做 CHGNet 弛豫"
  expected:
    formula_must_contain_all: ["Li", "Fe", "P", "O"]
    num_candidates: ">= 5"
    top_5_energy_below: -3.0
  must_pass_sim: true

- id: S003
  category: Li-ion cathode relaxation
  intent: "弛豫 LiNi0.8Mn0.1Co0.1O2 (NMC811)"
