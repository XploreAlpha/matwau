# ============================================================================
# constraints 提取测试(10 case)
# ============================================================================

- id: I021
  category: constraints
  intent: "出无钴锂电池正极实验方案"
  expected:
    subclass: "experiment_planning"
    material_system: "li_ion_cathode"
    forbidden_any: ["Co"]

- id: I022
  category: constraints
  intent: "出 LLZO 实验方案,无贵金属"
  expected:
    subclass: "experiment_planning"
    material_system: "solid_electrolyte"
    forbidden_any: ["Pt", "Au", "Ag"]

- id: I023
  category: constraints
  intent: "设计无 Pt 析氢催化剂"
  expected:
    subclass: "design_new_material"
    material_system: "catalyst_her"
    forbidden_any: ["Pt"]

- id: I024
  category: constraints
  intent: "出 Bi2Te3 热电材料实验方案"
  expected:
    subclass: "experiment_planning"
    material_system: "thermoelectric"
    elements: ["Bi", "Te"]

- id: I025
  category: constraints
  intent: "出 LiCoO2 实验方案,生成 10 个候选"
  expected:
    subclass: "experiment_planning"
    elements_any: ["Li", "Co", "O"]
    n_samples: 10

- id: I026
  category: constraints
  intent: "design new solid electrolyte without Pt and Au"
  expected:
    forbidden_any: ["Pt", "Au"]

- id: I027
  category: constraints
  intent: "出 MoS2 析氢催化剂,无 Co"
  expected:
    subclass: "experiment_planning"
    material_system: "catalyst_her"
    forbidden_any: ["Co"]

- id: I028
  category: constraints
  intent: "出 CsPbI3 钙钛矿太阳能实验方案"
  expected:
    subclass: "experiment_planning"
    material_system: "solar_cell"

- id: I029
  category: constraints
  intent: "出 LLZO 实验方案,禁止: Co、Mn"
  expected:
    forbidden_any: ["Co", "Mn"]

- id: I030
  category: constraints
  intent: "出锂离子电池正极,无 Co、无贵金属"
  expected:
    forbidden_any: ["Co", "Pt", "Au", "Ag"]