# MatWAU Goldens 测试集 — mat-intent(30 case)
# 写于:2026-07-24(W9 Day 1)
# 用途:验证 5 子类分类 + 11 material_system 识别 + 8 target_props 提取 + constraints
# per MatWAU-开发计划 §六 W9
# 跑分目标:pass-rate > 80% (Stage 2)

# 字段约定:
#   id: I001-I030
#   category: classify / system / props / constraints / full
#   intent: 用户 1 句话意图
#   expected:
#     subclass: 期望子类
#     material_system: 期望 material_system
#     target_props: 期望 target_props 列表
#     elements: 期望必含元素
#     forbidden: 期望禁止元素

