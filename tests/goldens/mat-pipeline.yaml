# MatWAU Goldens 测试集 — mat-pipeline 集成测试(25 case)
# 写于:2026-07-24(W8 Day 1)
# 用途:验证 4 段管线(mat-gen → mat-sim → mat-hpc → mat-exp)端到端工作流整合质量
# per MatWAU-开发计划 §5.6 + W8 测试 + 优化
# 跑分目标:pass-rate > 80% (Stage 2)

# 字段约定:
#   id: P001-P025
#   category: pipeline-XXX
#   intent: 用户 1 句话需求
#   expected:
#     elements: 必含元素列表
#     forbidden: 禁止元素列表(可选)
#     min_recipes: 最少最终实验方案数
#     min_stages_success: 至少多少段成功(默认 4)
#     max_cost_yuan: 单次 pipeline 总成本上限(可选)
#   must_pass_sim / must_pass_lit / must_pass_eis: 跨 agent 标记(预留)

# ============================================================================
# 锂电池正极集成测试(8 case)
# ============================================================================

- id: P001
  category: pipeline-li-ion
  intent: "出 LiCoO2 锂电池正极实验方案"
