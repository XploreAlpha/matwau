# ============================================================================
# W33 - LLM 二次复核(10 case, L001-L010)
# 字段约定:
#   category: llm_review
#   artifacts: { llm_response, llm_should_raise, enable_llm_review }
#   expected: llm_review_filled / llm_review_empty / llm_review_error_contains / llm_review_model / verdict_still_pass / verdict_still_warn
# ============================================================================

- id: L001
  category: llm_review
  intent: "默认 enable_llm_review=False → 不调 LLM"
  artifacts:
    enable_llm_review: false
    candidate: "LiCoO2"
  expected:
    llm_review_empty: true
    verdict_still_pass: true

- id: L002
  category: llm_review
  intent: "显式 enable_llm_review=True + mock client 同意 → llm_review 填"
  artifacts:
    enable_llm_review: true
    llm_response: "同意 verdict,综合分合理"
    candidate: "LiCoO2"
  expected:
    llm_review_filled: "同意 verdict,综合分合理"
    llm_review_model: "deepseek-v4-flash"
    verdict_still_pass: true

- id: L003
  category: llm_review
  intent: "LLM 建议改 warn,但规则 verdict 仍是 pass"
  artifacts:
    enable_llm_review: true
    llm_response: "建议改为 warn,理由:L4 一致性偏低"
    candidate: "LiCoO2"
  expected:
    llm_review_filled: "建议改为 warn,理由:L4 一致性偏低"
    verdict_still_pass: true  # LLM 不修改规则 verdict

- id: L004
  category: llm_review
  intent: "LLM API 失败 → fail-soft,verdict 仍正常,error 字段填"
  artifacts:
    enable_llm_review: true
    llm_should_raise: true
    candidate: "LiCoO2"
  expected:
    llm_review_empty: true
    llm_review_error_contains: "API down"
    verdict_still_pass: true

- id: L005
  category: llm_review
  intent: "LLM empty response → fail-soft"
  artifacts:
    enable_llm_review: true
    llm_empty_response: true
    candidate: "LiCoO2"
  expected:
    llm_review_empty: true
    verdict_still_pass: true

- id: L006
  category: llm_review
  intent: "ChemistReport 路径 + LLM review"
  artifacts:
    enable_llm_review: true
    llm_response: "同意 L4 一致性"
    use_chemist_report: true
    candidate: "Inconel 718"
  expected:
    llm_review_filled: "同意 L4 一致性"
    has_l4_score: true

- id: L007
  category: llm_review
  intent: "Explain failure 路径 + LLM review"
  artifacts:
    enable_llm_review: true
    llm_response: "XRD 谱不对是 phase 不匹配"
    explain_failure: "为什么 XRD 谱不对"
  expected:
    llm_review_filled: "XRD 谱不对是 phase 不匹配"

- id: L008
  category: llm_review
  intent: "LLM cost 加到 response.cost"
  artifacts:
    enable_llm_review: true
    llm_response: "OK"
    llm_prompt_tokens: 1000
    llm_completion_tokens: 500
    candidate: "LiCoO2"
  expected:
    cost_includes_llm: true
    llm_review_filled: "OK"

- id: L009
  category: llm_review
  intent: "mock client + target_sample 透传到 prompt"
  artifacts:
    enable_llm_review: true
    llm_response: "OK"
    target_sample: "Inconel 718"
    use_chemist_report: true
    candidate: "Inconel 718"
  expected:
    llm_review_filled: "OK"
    prompt_includes_sample: "Inconel 718"

- id: L010
  category: llm_review
  intent: "deepseek-v4-flash 是默认 model"
  artifacts:
    enable_llm_review: true
    llm_response: "OK"
    candidate: "LiCoO2"
  expected:
    llm_review_model: "deepseek-v4-flash"
