# MatWAU Goldens 测试集 — mat-critic(25 case)
# 写于:2026-07-24(W12 Day 1)
# 用途:验证 3 路打分(L1 物理 + L2 合成 + L3 安全)+ verdict + failures + suggestions
# per MatWAU-开发计划 §七 W12
# 跑分目标:pass-rate > 80% (Stage 2)

# 字段约定:
#   id: C001-C025
#   category: l1_physical / l2_synthesis / l3_safety / verdict / e2e
#   intent: 用户 1 句话意图(同时作为 candidates 生成依据)
#   candidates: 候选列表(每个有 formula + relaxed_energy / forces_max)
#   expected:
#     verdict: 期望 verdict (pass / warn / fail)
#     min_overall_score: 综合分 >= N
#     min_l1 / min_l2 / min_l3: 各路分 >= N
#     failure_codes: 期望识别到的失败 code 列表(任一即可)
#     has_suggestions: 是否应有建议
#     no_forbidden_in_suggestions: 建议不应包含的元素

# ============================================================================
# L1 物理一致性(8 case)
# ============================================================================

- id: C001
  category: l1_physical
  intent: "评估这些稳定候选"
  candidates:
    - formula: "LiCoO2"
      relaxed_energy: -3.5
      forces_max: 0.01
      stability: "stable"
    - formula: "LiFePO4"
      relaxed_energy: -3.2
      forces_max: 0.02
      stability: "stable"
  expected:
    verdict: "pass"
    min_overall_score: 0.8
    min_l1: 0.9

- id: C002
  category: l1_physical
  intent: "评估这些亚稳候选"
  candidates:
    - formula: "Li2SiO3"
      relaxed_energy: -2.2
      forces_max: 0.03
      stability: "metastable"
    - formula: "Na2O2"
      relaxed_energy: -1.8
      forces_max: 0.04
      stability: "metastable"
  expected:
    verdict: "pass"
    min_l1: 0.6

- id: C003
  category: l1_physical
  intent: "评估这些不稳定候选"
  candidates:
    - formula: "BadPhase1"
      relaxed_energy: 0.8
      forces_max: 0.9
      stability: "unstable"
    - formula: "BadPhase2"
      relaxed_energy: 1.2
      forces_max: 1.1
      stability: "unstable"
  expected:
    verdict: "warn"   # L1 严重但 L2/L3 OK,verdict=warn(可重新生成候选)
    min_l1: 0.0
    failure_codes_any: ["energy_too_high", "data_inconsistent"]

