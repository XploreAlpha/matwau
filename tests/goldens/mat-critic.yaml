# ============================================================================
# W30 - L4 跨机器人一致性(25 case, C026-C050)
# 字段约定:
#   category: cross_validation
#   artifacts.report: ChemistReport 形式(dict 含 robot_results)
#   expected: min_l4 / l4_consistent / l4_rules_failed_any / failure_codes_any / failure_codes_none
# ============================================================================

- id: C026
  category: cross_validation
  intent: "Inconel 718 完整表征"
  artifacts:
    report:
      target_sample: "Inconel 718"
      robot_results:
        - robot_type: "synth"
          success: true
          blocked: false
          artifacts:
            product_formula: "Inconel 718"
            yield_grams: 5.0
            cost: 500.0
        - robot_type: "xrd"
          success: true
          blocked: false
          artifacts:
            peaks: [{two_theta: 43.0}, {two_theta: 50.0}, {two_theta: 74.0}, {two_theta: 90.0}, {two_theta: 95.0}]
            matched_phase: "Inconel 718"
        - robot_type: "em"
          success: true
          blocked: false
          artifacts:
            elements_detected: [{element: "Ni", wt_pct: 53.0}, {element: "Cr", wt_pct: 19.0}, {element: "Fe", wt_pct: 18.0}]
        - robot_type: "dsc"
          success: true
          blocked: false
          artifacts:
            procedure: {sample_formula: "Inconel 718"}
            glass_transition_temp_c: null
            melting_temp_c: 1300.0
            crystallization_temp_c: null
  expected:
    verdict: "pass"
    min_overall_score: 0.6
    min_l4: 0.8
    l4_consistent: true
    failure_codes_none: [xrd_phase_mismatch, eds_extra_elements, dsc_class_mismatch]

- id: C027
  category: cross_validation
  intent: "合成 TiO2 但 XRD 报告 Al2O3 - phase mismatch"
