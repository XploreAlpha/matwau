# ============================================================================
# 锂电池正极材料(Li-ion cathode,15 case)
# ============================================================================

- id: G001
  category: Li-ion cathode
  intent: "设计 Li-ion cathode,能量密度 > 500 Wh/kg"
  expected:
    formula_must_contain: "Li"
    num_candidates: ">= 10"
    top_5_energy_below: -3.0  # eV/atom
  must_pass_sim: true

- id: G002
  category: Li-ion cathode
  intent: "找高能量密度锂硫电池正极材料"
  expected:
    formula_must_contain_any: ["Li", "S"]
    num_candidates: ">= 5"
  must_pass_lit: true

- id: G003
  category: Li-ion cathode
  intent: "设计 Li-rich 正极材料,容量 > 250 mAh/g"
  expected:
    formula_must_contain: "Li"
    num_candidates: ">= 8"
  must_pass_sim: true

- id: G004
  category: Li-ion cathode
  intent: "无钴 Li-ion 正极(降低对刚果矿依赖)"
  expected:
    formula_must_contain: "Li"
    formula_must_not_contain_any: ["Co"]
    num_candidates: ">= 10"

- id: G005
  category: Li-ion cathode
  intent: "高镍三元 NMC 正极,Ni 含量 > 80%"
  expected:
    formula_must_contain_any: ["Ni", "Mn", "Co"]
    num_candidates: ">= 5"
  must_pass_sim: true

- id: G006
  category: Li-ion cathode
  intent: "磷酸铁锂(LFP)正极的改性方案"
  expected:
    formula_must_contain_all: ["Li", "Fe", "P", "O"]
    num_candidates: ">= 3"

- id: G007
  category: Li-ion cathode
  intent: "锂离子电池 5V 级正极材料(高电压平台)"
  expected:
    formula_must_contain: "Li"
    num_candidates: ">= 6"
  must_pass_sim: true

- id: G008
  category: Li-ion cathode
  intent: "锂空气电池正极催化剂"
  expected:
    formula_must_contain_any: ["Pt", "Au", "Ag", "C"]
    num_candidates: ">= 5"

- id: G009
  category: Li-ion cathode
  intent: "低成本锂离子正极,不含 Ni/Co"
  expected:
    formula_must_contain: "Li"
    formula_must_not_contain_any: ["Ni", "Co"]
    num_candidates: ">= 10"

- id: G010
  category: Li-ion cathode
  intent: "尖晶石结构 LiMn2O4 改进方案"
  expected:
    formula_must_contain_all: ["Li", "Mn", "O"]
    num_candidates: ">= 3"

- id: G011
  category: Li-ion cathode
  intent: "固态锂电池正极(与固态电解质匹配)"
  expected:
    formula_must_contain: "Li"
    num_candidates: ">= 8"
  must_pass_sim: true

- id: G012
  category: Li-ion cathode
  intent: "锂离子电池正极,高倍率(快充)"
  expected:
    formula_must_contain: "Li"
    num_candidates: ">= 6"

- id: G013
  category: Li-ion cathode
  intent: "低温 Li-ion 正极(-40℃ 工作)"
  expected:
    formula_must_contain: "Li"
    num_candidates: ">= 5"
  must_pass_sim: true

- id: G014
  category: Li-ion cathode
  intent: "层状氧化物正极 LiNiO2 稳定性改进"
  expected:
    formula_must_contain_all: ["Li", "Ni", "O"]
    num_candidates: ">= 3"

- id: G015
  category: Li-ion cathode
  intent: "Li-ion 正极材料,循环寿命 > 5000 次"
  expected:
    formula_must_contain: "Li"
    num_candidates: ">= 5"

