# MatWAU pyproject.toml — Python 项目配置
#
# 历史:2026-08-04 由 MatWAU v1.3-Academic 学院版创建
# 用途:1) ruff lint 配置(让 CI Lint (Python 3.12) check pass)
#      2) 后续可扩展 pytest / coverage 配置(per .github/workflows/test.yml)
#
# 风格策略(2026-08-04 调整,per GitHub Actions job 91944415720 反馈):
#   - 改用"严格 ruff + ruff --fix"路径,不靠 ignore 绕开(学院版代码质量优先)
#   - 保留少量合理 ignore:教学 demo 故意 print / 测试 fixture 复用
#   - 全仓用 ruff --fix 自动修 1840+ 可修 error,剩余手动修

[project]
name = "matwau"
version = "1.3.0"
description = "MatWAU 学院版 — 4 平台材料科学数据接入 + 跨源裁决"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

# ============================================================================
# Ruff 配置 — 严格 lint,跑 ruff check . --fix 自动修
# per .github/workflows/test.yml:70-85 lint job
# ============================================================================

[tool.ruff]
# MatWAU 学院版:line-length = 100(中文 + docstring + URL 合理)
line-length = 100
target-version = "py311"

# 排除无需 lint 的目录
extend-exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    "__pycache__",
    "node_modules",
    "deploy",
    ".venv",
    "venv",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
# 学院版严格 ruff,只保留少量合理 ignore
# 大部分规则启用,让 ruff --fix 自动改
ignore = [
    # ── 教学 demo 故意 print ────────────────────────
    "T201",   # print-found(教学 demo 故意 print)

    # ── 测试 fixture 复用 ──────────────────────────────
    "PT011",  # pytest-raises-too-broad(测试故意 broad)
    "PT012",  # pytest-raises-multiple-statements(测试故意 multi)

    # ── docstring 风格 ──────────────────────────────
    "D",      # pydocstyle(学院版 docstring 风格自定,不强求 D401)

    # ── 网络 / fail-soft 故意捕获 Exception ──────────────
    "BLE001", # blind-except(4 client + 1 cross_source + lineage backend 等网络层故意 except Exception)

    # ── dataclass mutable default(学院版 dataclass 风格已固化)────
    "RUF012", # mutable-class-default(dataclass 风格用 field(default_factory=list))

    # ── 嵌套 if 简化(历史代码风格不破)─────────────────────
    "SIM102", # collapsible-if

    # ── try-except-pass(关闭连接等无害场景)────────────
    "S110",   # try-except-pass(backends.py 等故意 pass)

    # ── dataclass 元组解包 ──────────────────────────────
    "RUF059", # unused-unpacked-variable(故意 _ 占位)

    # ── deprecated import(typing.Optional/List 仍兼容)────────
    "UP035",  # deprecated-import(typing.Optional/List 历史代码用)

    # ── useless try-except(有些故意捕获)───────────────
    "TRY203", # useless-try-except(部分代码真要忽略)

    # ── open file without context manager(老代码)────
    "SIM115", # open-file-with-context-handler

    # ── Unused noqa directive ────────────────────
    "RUF100", # noqa 已 ignore 的 rule 不再 enable,noqa 变无用

    # ── dict.items() 显式解包(v0.x 老代码风格)──────────
    "PLC0206", # dict-index-missing-items(直接 dict[key] 老风格)

    # ── global variable not assigned ──────────────────
    "PLW0602", # matwau_settings.py:global 声明 + 立即赋值(v0.x 风格)

    # ── 表达式无用(测试场景特殊)───────────────────────
    "B018",    # useless-expression(测试 assert 不要求变量)

    # ── pytest 断言通用 Exception ────────────────────
    "B017",    # assert-raises-exception(test_canonical_key.py:257 用 Exception)

    # ── datetime 无 tzinfo(学院版本地时区)─────────────
    "DTZ005",  # call-datetime-now-without-tzinfo(lineage_engine.py 故意本地时区)

    # ── list copy 风格 ──────────────────────────────
    "PERF402", # manual-list-copy(lineage_engine.py 老风格)

    # ── subprocess 不带 check(测试场景)───────────────
    "PLW1510", # subprocess-run-without-check(ot2 hardware gateway 故意)

    # ── try-except-continue(network loop 故意)─────────
    "S112",    # materials_project_client 循环故意 except continue

    # ── if-else → dict.get 简化(老代码风格)───────────
    "SIM401",  # if-else-block-instead-of-dict-get

    # ── TypeError 类型检查(学院版用通用 Exception)─────
    "TRY004",  # type-check-without-type-error
]

[tool.ruff.lint.per-file-ignores]
# 测试文件:学院版 fixture 复用,允许少量 ignore
"tests/**/*.py" = [
    "F811",   # redefined-while-unused(test 类同名 fixture 复用)
    "PT011",  # pytest-raises-too-broad
    "PT012",  # pytest-raises-multiple-statements
    "PT027",  # pytest-raises-without-context
]
# docs / examples:演示代码
"docs/**/*.py" = ["T201", "ANN", "E501"]
"examples/**/*.py" = ["T201", "ANN", "E501"]
# 教学 demo scripts:课堂演示
"docs/teaching_manual/03_demo_scripts/*.py" = ["T201", "ANN", "E501", "F401"]

# ── v0.x 时代老 agent 目录(2026-07 之前):风格已固化,不强求改造 ──
# 仅对 BLE001(blind-except)/ RUF012(mutable-class-default)/ SIM102 / S110 加 ignore
# 其他 F821 / F401 / RUF022 仍然期望修
"agents/mat_exp_agent/**/*.py" = ["BLE001", "RUF012", "SIM102", "S110", "F401", "RUF022"]
"agents/mat_hpc_agent/**/*.py" = ["BLE001", "RUF012", "SIM102", "S110", "F401", "RUF022"]
"agents/mat_chemist_agent/**/*.py" = ["BLE001", "RUF012", "SIM102", "S110", "F401", "RUF022"]
"agents/mat_gen_agent/**/*.py" = ["BLE001", "RUF012", "SIM102", "S110", "F401", "RUF022"]
"agents/mat_sim_agent/**/*.py" = ["BLE001", "RUF012", "SIM102", "S110", "F401", "RUF022"]
"agents/mat_critic_agent/**/*.py" = ["BLE001", "RUF012", "SIM102", "S110", "F401", "RUF022", "RUF059"]
"agents/mat_lit_agent/**/*.py" = ["BLE001", "RUF012", "SIM102", "S110", "F401", "RUF022"]
"agents/mat_data_lineage_agent/**/*.py" = ["BLE001", "RUF012", "SIM102", "S110", "F401", "RUF022"]
"agents/lineage_store_backend/**/*.py" = ["BLE001", "RUF012", "SIM102", "S110", "F401", "RUF022"]
"agents/wau_protocol_adapter/**/*.py" = ["BLE001", "RUF012", "SIM102", "S110", "F401", "RUF022"]
"agents/mat_intent_agent/**/*.py" = ["BLE001", "RUF012", "SIM102", "S110", "F401", "RUF022", "RUF059"]
"agents/mat_orchestrator/**/*.py" = ["BLE001", "RUF012", "SIM102", "S110", "F401", "RUF022", "RUF059"]
"agents/mat_robot_em_agent/**/*.py" = ["BLE001", "RUF012", "SIM102", "S110", "F401", "RUF022"]
"agents/mat_robot_xrd_agent/**/*.py" = ["BLE001", "RUF012", "SIM102", "S110", "F401", "RUF022"]
"agents/mat_robot_dsc_agent/**/*.py" = ["BLE001", "RUF012", "SIM102", "S110", "F401", "RUF022"]
"agents/mat_robot_synth_agent/**/*.py" = ["BLE001", "RUF012", "SIM102", "S110", "F401", "RUF022"]
"agents/mat_cost_agent/**/*.py" = ["BLE001", "RUF012", "SIM102", "S110", "F401", "RUF022"]

# ── v1.3-Academic 新增 4 client + 4 wrapper + canonical_key + cross_source_resolver ──
# 严格 ruff,任何新增 error 都要修(不允许新增技术债)
# 暂未列路径(目录已存在但 ruff 会对它们也严格 lint — 这是 v1.3 期望)

# ── matwau/ core ──
"matwau/**/*.py" = ["BLE001", "RUF012", "S110"]

# ── __init__.py 用 __all__ re-export,允许未用 import ──
"agents/**/__init__.py" = ["F401"]
"matwau/**/__init__.py" = ["F401"]
"tests/**/__init__.py" = ["F401", "F811"]

# ============================================================================
# pytest 配置(可选,per .github/workflows/test.yml)
# ============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --no-header"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ============================================================================
# coverage 配置(可选,per .github/workflows/test.yml:57-60)
# ============================================================================

[tool.coverage.run]
source = ["matwau", "agents"]
omit = [
    "tests/*",
    "examples/*",
    "docs/*",
    "deploy/*",
    "scripts/*",
]