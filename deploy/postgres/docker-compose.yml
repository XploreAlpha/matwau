# Postgres 部署 — 本机 DSN + docker compose(W23 真接)
#
# 一键起:
#   docker compose -f deploy/postgres/docker-compose.yml up -d
#
# 然后在 MatWAU 设置环境变量:
#   export MATWAU_PG_DSN="postgresql://matwau:matwau_dev_pw@localhost:5432/matwau"
#
# PostgresBackend 检测到 DSN + psycopg 已装 → 自动走真 PG(否则降级 SQLite)

services:
  postgres:
    image: postgres:16-alpine
    container_name: matwau-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: matwau
      POSTGRES_PASSWORD: matwau_dev_pw       # 占位 — 生产用 secret
      POSTGRES_DB: matwau
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - matwau_pg_data:/var/lib/postgresql/data/pgdata
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matwau -d matwau"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  matwau_pg_data:
    name: matwau_pg_data   # 持久化 — docker volume
