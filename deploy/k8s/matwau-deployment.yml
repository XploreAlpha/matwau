# MatWAU k8s deployment(W29 远程部署)
# 用法:
#   kubectl apply -f deploy/k8s/matwau-deployment.yml
#   kubectl get pods -l app=matwau

apiVersion: v1
kind: ConfigMap
metadata:
  name: matwau-config
  labels:
    app: matwau
data:
  MATWAU_PG_DSN: "postgresql://matwau:matwau_dev_pw@matwau-postgres-primary:5432/matwau"
  MATWAU_OPENTRONS_HOST: "matwau-ot2-simulator"
  MATWAU_OPENTRONS_PORT: "31950"
  MATWAU_ZEISS_SMARTSEM_URL: "http://matwau-zeiss:49150/smartsem/v1"
  MATWAU_TA_TRIOS_URL: "http://matwau-ta-trios:49160/triosautopilot/v1"
  MATWAU_LOG_LEVEL: "INFO"
---
apiVersion: v1
kind: Secret
metadata:
  name: matwau-secrets
type: Opaque
stringData:
  MATWAU_PG_PASSWORD: "matwau_dev_pw_replace_in_prod"
  HF_TOKEN: "hf_replace_in_prod"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matwau-coordinator
  labels:
    app: matwau
    component: coordinator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: matwau
      component: coordinator
  template:
    metadata:
      labels:
        app: matwau
        component: coordinator
    spec:
      containers:
      - name: matwau-coordinator
        image: python:3.11-slim
        command: ["python3", "-m", "agents.mat_chemist_agent.mat_chemist_agent"]
        envFrom:
        - configMapRef:
            name: matwau-config
        - secretRef:
            name: matwau-secrets
        ports:
        - containerPort: 8000
          name: http
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: matwau-coordinator
  labels:
    app: matwau
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  selector:
    app: matwau
    component: coordinator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matwau-ot2-simulator
  labels:
    app: matwau
    component: ot2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matwau
      component: ot2
  template:
    metadata:
      labels:
        app: matwau
        component: ot2
    spec:
      containers:
      - name: ot2
        image: opentrons/opentrons-emulation:latest
        ports:
        - containerPort: 31950
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: matwau-ot2-simulator
spec:
  type: ClusterIP
  ports:
  - port: 31950
    targetPort: 31950
  selector:
    app: matwau
    component: ot2