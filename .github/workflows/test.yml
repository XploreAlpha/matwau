# MatWAU CI — GitHub Actions
# per MatWAU-开发计划 §5.6 W8 测试 + 优化
#
# 跑 3 件:
# 1. 单元测试(195+23+10 = 228+ 测试)
# 2. 集成 Goldens 跑分(25 case)
# 3. lint + coverage(可选)
#
# 注:本机无 GPU / 超算,Stage 1 mock 全跑通

name: MatWAU CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pyyaml pydantic

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --tb=short --maxfail=5

      - name: Run pipeline Goldens (集成)
        run: |
          pytest tests/unit/test_pipeline_goldens.py -v --tb=short

      - name: Run stress tests (压力)
        run: |
          pytest tests/unit/test_stress.py -v --tb=short

      - name: Generate coverage report
        if: matrix.python-version == '3.12'
        run: |
          pytest tests/unit/ --cov=matwau --cov=agents --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  lint:
    name: Lint (Python 3.12)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check .